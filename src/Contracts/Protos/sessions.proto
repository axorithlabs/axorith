syntax = "proto3";

package axorith.contracts;

import "Protos/common.proto";

option csharp_namespace = "Axorith.Contracts";

service SessionsService {
  rpc GetSessionState(GetSessionStateRequest) returns (SessionState);
  rpc GetSessionHistory(GetSessionStateRequest) returns (SessionHistory);
  rpc PreflightSession(PreflightSessionRequest) returns (OperationResult);
  rpc StartSession(StartSessionRequest) returns (OperationResult);
  rpc StopSession(StopSessionRequest) returns (OperationResult);
  rpc StartBreak(StartBreakRequest) returns (OperationResult);
  rpc StreamSessionEvents(StreamSessionEventsRequest) returns (stream SessionEvent);
  rpc HoldEmergencyUnlock(stream EmergencyUnlockHoldSignal) returns (stream EmergencyUnlockHoldProgress);
}

message GetSessionStateRequest {
  // Empty on purpose: reserved for future filter fields (for example, session_id).
}

message SessionHistoryEntry {
  int64 started_at_unix_ms = 1;
  int64 ended_at_unix_ms = 2;
  string preset_name = 3;
}

message SessionHistory {
  repeated SessionHistoryEntry entries = 1;
}

message StartSessionRequest {
  string preset_id = 1;
  string session_instance_id = 2;
  string start_source = 3;
}

message PreflightSessionRequest {
  string preset_id = 1;
}

message StopSessionRequest {
  // Empty on purpose: reserved for future options (for example, force flags).
}

message StreamSessionEventsRequest {
  // Future extension point: add filters (for example, by session id or event type).
}

message StartBreakRequest {}

message EmergencyUnlockHoldSignal {
  bool is_held = 1;
}

message EmergencyUnlockHoldProgress {
  double progress = 1;
  bool completed = 2;
  string message = 3;
}
