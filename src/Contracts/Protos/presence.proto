syntax = "proto3";

package axorith;

option csharp_namespace = "Axorith.Contracts.Generated";

message PresenceMessage {
  int64 timestamp = 1;
  string client_version = 2;
  bool is_disconnect = 3;
}

message PresenceAck {
  int64 server_timestamp = 1;
  bool acknowledged = 2;
}

service PresenceService {
  rpc StreamClientPresence(stream PresenceMessage) returns (stream PresenceAck);
}
