name: Axorith CI/CD

on:
  push:
    branches: [ "main", "dev/**" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  SOLUTION_PATH: './Axorith.sln'
  Configuration: Release
  AVALONIA_TELEMETRY_OPTOUT: '1'
  AXORITH_DEV: '1'
  AXORITH_TEST_MODE: '1'
  AXORITH_TELEMETRY_DISABLED: '1'
  AXORITH_TELEMETRY_API_KEY: '##E2E_DISABLED##'
  AXORITH_TELEMETRY_HOST: 'http://127.0.0.1:9'

jobs:
  tests:
    name: 🧪 Tests & Quality
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }} -p:Configuration=${{ env.Configuration }}

      - name: Build (No Restore)
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration ${{ env.Configuration }} --no-restore

      - name: Run Unit Tests
        run: ./scripts/run-tests.ps1 -Suite Unit -NoBuild -Coverage
      
      - name: Run Integration Tests
        run: ./scripts/run-tests.ps1 -Suite Integration -NoBuild -Coverage

      - name: Test production browser-extension script
        run: node --test tests/browser/site-blocker.test.cjs

      - name: Upload test and coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/Release/*.trx
            build/Release/**/coverage.cobertura.xml
          if-no-files-found: error

  build-installer:
    name: 📦 Build Windows Installer
    needs: tests
    runs-on: windows-latest
    env:
      POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
      POSTHOG_API_HOST: ${{ secrets.POSTHOG_API_HOST }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          include-prerelease: true

      - name: Extract Version from Tag
        id: get_version
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref }}".StartsWith('refs/tags/v')) { "${{ github.ref_name }}" } else { git describe --tags --abbrev=0 }
          if ($LASTEXITCODE -ne 0) { throw 'Could not resolve the product version.' }
          $version = $tag.TrimStart('v')
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version: $version"
      
      - name: Setup NSIS
        uses: repolevedavaj/install-nsis@v1.1.0
        with:
          nsis-version: 3.11
      
      - name: Install NSIS Plugins
        shell: pwsh
        run: |
          $nsisPluginsDir = "${env:ProgramFiles(x86)}\NSIS\Plugins\x86-unicode"
          if (-not (Test-Path $nsisPluginsDir)) {
            New-Item -ItemType Directory -Force $nsisPluginsDir | Out-Null
          }
          
          Write-Host "Downloading InetC plugin..."
          $inetcUrl = "https://nsis.sourceforge.io/mediawiki/images/c/c9/Inetc.zip"
          $inetcZip = "$env:TEMP\inetc.zip"
          Invoke-WebRequest -Uri $inetcUrl -OutFile $inetcZip
          
          Expand-Archive -Path $inetcZip -DestinationPath "$env:TEMP\inetc" -Force
          Copy-Item "$env:TEMP\inetc\Plugins\x86-unicode\INetC.dll" $nsisPluginsDir -Force
          
          Write-Host "InetC plugin installed successfully"
          
          if (Test-Path "$nsisPluginsDir\INetC.dll") {
            Write-Host "INetC.dll found at: $nsisPluginsDir\INetC.dll"
          } else {
            Write-Error "Failed to install INetC plugin"
            exit 1
          }
      
      - name: Add NSIS to PATH
        shell: pwsh
        run: |
          $nsisPath = "${env:ProgramFiles(x86)}\NSIS"
          if (Test-Path $nsisPath) {
            echo "$nsisPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            Write-Host "Added NSIS to PATH: $nsisPath"
          } else {
            Write-Error "NSIS not found at $nsisPath"
            exit 1
          }

      - name: Ensure PostHog key is present
        if: ${{ startsWith(github.ref, 'refs/tags/v') && env.POSTHOG_API_KEY == '' }}
        shell: pwsh
        run: |
          Write-Error "POSTHOG_API_KEY secret is required for telemetry patching (CI injects into TelemetryDefaults)."
          exit 1
      
      - name: Verify NSIS Installation
        shell: pwsh
        run: |
          $nsisPath = Get-Command "makensis.exe" -ErrorAction SilentlyContinue
          if (-not $nsisPath) {
            $nsisPath = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
            if (-not (Test-Path $nsisPath)) {
              Write-Error "NSIS not found. Installation may have failed."
              exit 1
            }
          }
          Write-Host "NSIS found at: $($nsisPath.Source ?? $nsisPath)"
          & makensis /VERSION
      
      - name: Run Build Script (Publish & NSIS)
        shell: pwsh
        run: |
          ./installer/windows/build.ps1 -Version ${{ steps.get_version.outputs.VERSION }}

      - name: Build installed-product test client
        shell: pwsh
        run: dotnet build ./tests/Axorith.Integrations.Tests/Axorith.Integrations.Tests.csproj -c Release

      - name: Exercise actual installer, repair, upgrade, and uninstaller
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          Start-Transcript -Path ./build/Release/installer-e2e.log
          try { ./scripts/test-installer.ps1 }
          finally { Stop-Transcript }

      - name: Upload installer E2E results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-test-results
          path: |
            ./build/Release/installed-product-*.trx
            ./build/Release/installer-e2e.log
            ./build/Release/browser-e2e.log
            ./build/Release/firefox-e2e.log
            ./build/Release/host-process-e2e.log
          if-no-files-found: error
      
      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: ./build/Installer/axorith-setup.exe
          if-no-files-found: error

  create-release:
    name: 🚀 Create Release
    needs: [build-installer]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./release-assets

      - name: Build Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: ".github/changelog-config.json"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Chrome extension
        shell: pwsh
        run: |
          ./src/Modules/SiteBlocker/BrowserExtension/package.ps1 -Browser Chrome
          Copy-Item ./src/Modules/SiteBlocker/BrowserExtension/Chrome/chrome-extension-latest.zip ./release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          body: ${{ steps.build_changelog.outputs.changelog }}
          files: |
            ./release-assets/axorith-setup.exe
            ./release-assets/chrome-extension-latest.zip
          draft: true
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
